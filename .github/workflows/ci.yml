name: ci

on:
  push:
    branches: [main, master, "feat/**"]
  pull_request:

jobs:
  lint:
    name: lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux native deps (Bevy ui / X11 / Xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            build-essential \
            xvfb \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libasound2-dev \
            libudev-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            mesa-vulkan-drivers \
            libegl1-mesa-dev

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test --lib
        run: cargo test --all-features --lib

      - name: runtime-only check
        run: cargo check --no-default-features --features runtime

      - name: cargo package
        if: github.event_name == 'push'
        run: cargo package

  fixture:
    name: fixture (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux native deps (Bevy ui / X11 / Xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            build-essential \
            xvfb \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libasound2-dev \
            libudev-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            mesa-vulkan-drivers \
            libegl1-mesa-dev

      - name: Rendered fixture tests (Linux / Xvfb, serialized)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --features fixture --tests -- --test-threads=1

      - name: Rendered fixture tests (Windows, serialized)
        if: runner.os == 'Windows'
        run: cargo test --features fixture --tests -- --test-threads=1

      - name: Survivor scan (Linux)
        if: always() && runner.os == 'Linux'
        run: bash ./scripts/assert_no_fixture_processes.sh

      - name: Survivor scan (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $procs = Get-Process -Name "bevy-e2e-fixture" -ErrorAction SilentlyContinue
          if ($null -ne $procs) {
            Write-Host "error: leaked bevy-e2e-fixture process(es):"
            $procs | Format-Table Id, ProcessName, StartTime -AutoSize
            exit 1
          }
          Write-Host "ok: no bevy-e2e-fixture survivor processes"

      - name: Upload test_output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.os }}
          path: |
            test_output/**
            target/e2e-test-output/**
          if-no-files-found: ignore

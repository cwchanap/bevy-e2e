name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    name: validate versioned release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Resolve package version
        id: package
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ -z "$version" ]; then
            echo "error: could not resolve package version from Cargo.toml" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Verify release tag matches package version
        shell: bash
        run: |
          expected="${{ steps.package.outputs.tag }}"
          actual="${{ github.event.release.tag_name }}"
          if [ "$actual" != "$expected" ]; then
            echo "error: release tag $actual does not match Cargo.toml version $expected" >&2
            exit 1
          fi

      - name: Verify package
        run: cargo package --locked
